# Requirements outrank every config layer. A repository's own .codex/ is not loaded at all
# (wlp-codex-app-server); the hook and MCP settings below hold even if it were.

# Auto review lets Codex's own reviewer model approve a command outside the sandbox. The platform does
# not offer that mode; a turn that asks for it fails.
allowed_approvals_reviewers = ["user"]

# Only hooks from managed layers run: the PermissionRequest hook in /etc/codex/config.toml, never a hook
# from a user, project or plugin layer. Codex runs a hook outside its sandbox.
allow_managed_hooks_only = true

# The PermissionRequest hook in config.toml refuses requests to leave Codex's sandbox: keep hooks on.
# A shell snapshot runs the agent's login shell outside Codex's sandbox at each session start, and so
# ~/.bash_profile or ~/.profile, which a repository's setup command can write: keep snapshots off.
[features]
codex_hooks = true
shell_snapshot = false

# One MCP server only, the platform's (report, ask_person, push, fetch_base and publish), by its exact URL: the loopback endpoint
# wlp-acp-mcp serves in front of codex-acp, which answers each request on the platform's ACP connection.
# Codex starts no other MCP server from any config layer; one would run outside the sandbox. The path is
# the server's fixed id, `windlass-platform` (server/src/platform-tools.ts), in base64url.
[mcp_servers.windlass_platform.identity]
url = "http://127.0.0.1:17895/mcp-d2luZGxhc3MtcGxhdGZvcm0"
