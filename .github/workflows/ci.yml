name: CI

# Agent branches (wip/**, windlass/**) run on push, since a subtask branch has no PR; a PR from one
# of them would run the same commit again, so pull_request jobs skip those heads.
on:
  push:
    branches: [main, 'wip/**', 'windlass/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A newer push to a branch replaces its older run; main keeps every run to show which commit broke it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    # The push of an agent branch already ran this commit.
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'wip/') || startsWith(github.head_ref, 'windlass/'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/agents-docs-check.ts
      - run: pnpm typecheck
      - run: pnpm --filter @windlass-platform/web build

  test-shard:
    # Agent PRs use the path-selected heavy suites. On a PR, github.ref is the merge ref.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'wip/') && !startsWith(github.head_ref, 'windlass/'))
    strategy:
      fail-fast: false
      matrix:
        shard: [factory, core, usage, resume]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WLP_SANDBOX: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:${{ matrix.shard }}

  # Keep the single check required by the main branch ruleset.
  test:
    needs: test-shard
    if: ${{ always() && needs.test-shard.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - run: test "$SHARD_RESULT" = success
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}

  secret-scan:
    # The push of an agent branch already ran this commit.
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'wip/') || startsWith(github.head_ref, 'windlass/'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The complete checkout includes the PR commits. No PR API access is needed.
      - uses: gacts/gitleaks@4fd785dcdaf557fda64e05b0ae033b8f7d82fb81 # v1.3.3
        with:
          version: '8.28.0'
